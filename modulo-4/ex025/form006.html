<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
 <h1>Exemplo de Formulário </h1>  
 <form id="form-cadastro" method="POST" autocomplete="on"><!-- post para enviar arquivos ate 3000 bites  -->
    <p>
        <label for="icor">Cor</label>
        <input type="color" name="cor" id="icor" value="#00ff00">
    </p>
    <p>
        <label for="inivel">Nível de Satisfação</label>
        <input type="range" name="nivel" id="inivel" min="1" max="5" value="5">
    </p>

    <p>
        <label for="foto">Foto perfíl</label>
        <input type="file" name="foto" id="ifoto">

    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

 </form>

 <script>
    document.getElementById('form-cadastro').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const params = new URLSearchParams();
        
        for (let [key, value] of formData.entries()) {
            params.append(key, value);
        }
        
        // Fazer POST visível no Network
        fetch('cadastro.html', {
            method: 'POST',
            body: new URLSearchParams(params),
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        })
        .catch(() => {}) // Ignorar erro 405 do Live Server
        .finally(() => {
            // Redirecionar via GET para exibir dados
            window.location.href = 'cadastro.html?' + params.toString();
        });
    });
 </script>
</body>
</html>
