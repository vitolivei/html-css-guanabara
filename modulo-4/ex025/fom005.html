<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Exemplo de Formulário</h1>
    <form id="form-cadastro" method="POST" autocomplete="on">
    <fieldset>
      <legend>Sexo</legend><!--  <input type="radio" name="sexo"no caso de 1 alternativa alternativa coloca o mesmo nome no name do botâo -->
      <input type="radio" name="sexo" id="isxmas" value="M"><label for="isxmas">Masculono</label><br>
      <input type="radio" name="sexo" id="isxfem" value="F" checked><!-- checked feminino fica marcado value "F"valor url-->
      <label for="isxfem">Feminino</label>
    </fieldset>
      <fieldset>
      
      <legend>Esportes Favoritos</legend>
      <input type="checkbox" name="esbas" id="iesbas" />
      <label for="iesbas">Basquet</label><br><!-- entre label pode clicar também na palavra -->
      <input type="checkbox" name="esfut" id="iesfut" checked/>
      <label for="iesfut" >Futebol</label><br>
      <input type="checkbox" name="esnat" id="iesnat" />
      <label for="iesnat"> Natação</label><br>
      <input type="checkbox" name="esten" id="iesten" />
      <label for="iesten">Tênis</label>
    </fieldset>

    <p>
      <input type="submit" value="Enviar" />
      <input type="reset" value="Limpar" />
    </p>
  </form>

  <script>
    document.getElementById('form-cadastro').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const params = new URLSearchParams();
        
        for (let [key, value] of formData.entries()) {
            params.append(key, value);
        }
        
        // Fazer POST visível no Network
        fetch('cadastro.html', {
            method: 'POST',
            body: new URLSearchParams(params),
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        })
        .catch(() => {}) // Ignorar erro 405 do Live Server
        .finally(() => {
            // Redirecionar via GET para exibir dados
            window.location.href = 'cadastro.html?' + params.toString();
        });
    });
  </script>
  </body>
</html>
