<!DbodyPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclar Tabelas</title>
        <style>
        body{
           
            font-family: 'Times New Roman', Times, serif;    
        }
        table{
            border-collapse: collapse;
            width: 300px;
        }
         td,th{
            border: 1px solid blue;
            padding: 10px;
            text-align: center;
        }    
        </style>
        
    

</head>
<body>
   <table>
        <td>A</td>
        <td colspan="2">B</td>
        
    </tr>
    <tr>
        <td rowspan="3">D</td>
        <td>E</td>
        <td rowspan="2
        ">F</td>
    </tr>
    <tr>
        <td>H</td>
        
    </tr>
    <tr>
        
        
        
        <td colspan="2">M</td>
    </tr>
   </table>
</body>
</html>
