<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha primeira Tabela</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table{
        width: 400px;
        height: 400px;
        border-collapse: collapse; /* junta linha das celulas */
      }
    td{
        border: 1px solid black;/*borda dos dados*/
        padding: 8px;
        text-align: left;/*alinha na horizontal*/
        vertical-align: top;/*alinha na vertical padrão (middle)*/
    }
    .numero{
        text-align: right;
    }
    </style>
  </head>
  <body>
    <h1>Minha primeira Tabela</h1>
    <!--Hierarquia de tabelas (simples
    Table = tabelas
    Table row = linha de tabelas
    Table header= cabeçalho de tabelas
    table data = dados de tabela) -->
    <table>
      <tr><!-- linha1  -->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>
      <tr>
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td> <!--somente este a direita-->
      </tr>
      <tr>
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
      </tr>
        <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
      </tr>
    </table>
  </body>
</html>
