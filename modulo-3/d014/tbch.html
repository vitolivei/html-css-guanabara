<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tabela Notas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    table {
      border-collapse: collapse;
      margin: auto;
      width: 600px;
    }

    caption {
      font-size: 1.5em;
      font-weight: bold;
      padding: 10px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
    .me{
        color: white;
        background-color: #777;

    }
    thead {
      background-color: #555;
      color: white;
    }

    tfoot {
      background-color: #777;
      color: white;
    }

    .area {
      font-weight: bold;
    }
  </style>
</head>

<body>

<table>
  <caption>Notas dos Alunos</caption>

  <thead>
    <tr>
      <th rowspan="2">Área</th>
      <th rowspan="2">Disciplinas</th>
      <th colspan="2">Notas</th>
      <th rowspan="2">Média</th>
    </tr>
    <tr>
      <th>Nota 1</th>
      <th>Nota 2</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <th rowspan="4" class="area">Exatas</th>
      <td>Matemática</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>

    <tr>
      <td>Física</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>

    <tr>
      <td>Química</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>

    <tr>
      <td>Biologia</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>

    <tr>
      <th class="me" colspan="4">Média de Exatas</th>
      <td class="me">2.0</td>
    </tr>

    <tr>
      <th rowspan="2" class="area">Humanas</th>
      <td>História</td>
      <td>3.0</td>
      <td>4.0</td>
      <td>0.0</td>
    </tr>

    <tr>
      <td>Geografia</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <th colspan="4">Média de Humanas</th>
      <td>0.0</td>
    </tr>
  </tfoot>

</table>

</body>
</html>
