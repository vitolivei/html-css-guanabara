<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Notas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 600px;
            border-collapse: collapse;
            margin: auto;
        }
        caption{
            font-size: 1.5em;
            padding: 8px;
            font-weight: bold;
           
        }
        th ,td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        .me{
            background-color: grey;
            color: white;
        }  
        thead{
            color: white;
            background-color: grey;
           
            color: white;
        }
        tfoot{
            background-color: grey;
            color: white;
            }
        .area{
            font-weight: bold;
        }

        
    </style>
</head>
<body>
    <table>
        <caption>Notas das Matérias</caption>
        <thead>
            <th scope="colgroup" rowspan="2">Área</th>
            <th rowspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Médias</th>
        </thead>
        <tr>
            <th rowspan="4">Exatas</th>
            <td>Mateática</td>
            <td>Físi</td>

        </tr>
    </table>
</body>
</html>
