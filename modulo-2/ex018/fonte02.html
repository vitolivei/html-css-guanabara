<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face{
            font-family:'love';
            src: url('love larry ttf.ttf'),
             format('opentype'),
             url('love larry ttf.ttf'),
            format('truetype');
            font-weight: normal;
            font-style:normal;
                }
            /*Tipos de format()          
            format( ' truetype ' ) ;
            1
            Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetypfonte-aat (Apple Advanced
            Typography)
            - svg
            */
        
        body{
            font-family:'love', Helvetica, sans-serif;
        }
        h1{
            font-family: 'love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos facere dolores magni unde dolore aspernatur magnam similique! Minima, autem facere aliquid quo ullam dolorum eos laborum voluptatem temporibus incidunt unde!</p>
</body>
</html>
