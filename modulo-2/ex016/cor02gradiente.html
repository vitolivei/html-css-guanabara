<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em css</title>
    <style>
        *{/*Configurações globais*/
          height: 100%; /*hight 100% senão fica zebrado usando top*/

        body{/*opçoes top,bottom,right,left*/

        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
