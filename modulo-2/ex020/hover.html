<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exemplo hover</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
            }
            div > p{/*>p p é filho e so o paragrafo vai receber a mudança*/
                display: none;/*PARAGRAFO DENTRO DA DIV OCULTO*/
            }    
            div:hover > p{/*HOVER PSEUDO CLASSE MUDA COR DA DIV*/
                display: block;
                
                color: white;
                background-color: red;
                width: 300;
            }
            
            div:hover{/**/
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>Exemplo de hover</h1>
        <p>Passe o mouse sobre o texto abaixo</p>
        <div>Passe o mouse
            <P>TEXTO ESCONDIDO</P>
        </div>
        <p>fim do exemplo</p>
    </body>
</html>
