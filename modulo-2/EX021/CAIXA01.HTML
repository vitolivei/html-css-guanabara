<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo de Caixas</title>
    <style>
      h1 {
        background-color: lightgray;
        height: 300px;
        width: 300px;
        /*simplificada:border:10px solid gray */
        border-width: 10px;
        border-style: solid;
        border-color: rgb(151, 146, 146);
        /*padding: espaço letra borda, da borda para dentro
        padding: 1Opx 10px 10px 10px l0px(se iguais pode usar so 1 parametro, )*/
        padding-top: 20px; 
        padding-right: 19px;
        padding-bottom: 15px;
        padding-left: 19px;
        margin: 10px; /*não usa cor,distancia da borda para fora,
        centralizar usa : auto, só esquerda e direita
         auto:20 auto 20 auto; */
        outline-widht: 10;/*outline fica dentro da borda: display: ;;*/
        outline-style: dashed;
        outline-color: bisque;
      }
      a {
        border-width: l0px;
        border-style: solid;
        border-color: rgba(255, 0, 0, 0.453);
        /*aqui também pode usar padding e ajustar o*/
      }
    </style>
  </head>
  <body>
    <h1>Exemplo de caixa box level</h1>
    <p>
      Parágrafos também são exemplos de box-level, mas os
      <a href="#">links são exemplos de caixas inline-level</a>.Vamos ver como
      tudo isto funciona
    </p>
  </body>
</html>
