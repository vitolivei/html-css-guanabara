<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir este site em vários dispositivos difrentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
<source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
<source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
<img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
   
    <!-- opção com 1 midia pode ser que em alguns navegadores não rode-->
   <!--<audio src="midia/guanacast-33.mp3" controls autoplay></audio>--> 
    
   <!-- opção 2 3 tipos de midia -->
    <audio  preload="metadata" autoplay controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mp3">
        <source src="midia/guanacast-33 (1).ogg" type="audio/ogg">
        <source src="midia/guanacast-33 (1).wav" type="audio/wav">
        <p>Infelismente seu navegador não consegue reproduzir audio. <a href="midia/guanacast-33.mp3">Clique aqui para baixar o arquivo mp3
            
        </a></p>

<!--evitar wav é pesado-->
    </audio>
</body>
</html>
